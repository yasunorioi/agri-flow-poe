; agri-flow-poe — M5Stack ATOM PoE flow meter node (DIGITEN hall-effect)
;
; Hardware
;   - M5Stack ATOM Lite + ATOM PoE Base (W5500)
;   - DIGITEN flow meter on Grove G26 (signal, FALLING-edge counted via ISR)
;       Black/GND on Grove GND, Red/VCC on Grove 5V (or 3.3V depending on model)
;
; Default: pulses_per_liter=450 (typical of YF-S201 family). Re-tune from
; the device's /config page after measuring with a known volume.

[env:m5atom-poe]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38
board = m5stack-atom
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
	https://github.com/yasunorioi/agri-node-poe-core.git
